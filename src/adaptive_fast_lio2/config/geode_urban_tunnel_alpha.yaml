adaptive_fastlio_mapping:
  ros__parameters:
    common:
      # GEODE Urban Tunnel 设备 alpha：VLP-16 点云与 Xsens MTi-30 IMU。
      lid_topic: "/velodyne_points"
      imu_topic: "/imu/data"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 2
      scan_line: 16
      # Urban_Tunnel01 的 PointCloud2.time 为秒，范围约为 [-0.1, 0]。
      timestamp_unit: 0
      scan_rate: 10
      blind: 0.5

    # GEODE 点云按每个方位角连续存放 16 条 ring；设为 1 可保留完整 VLP-16 点云。
    point_filter_num: 1
    feature_extract_enable: false

    publish:
      scan_publish_en: true
      dense_publish_en: true
      scan_bodyframe_pub_en: true
      map_en: true

    mapping:
      gyr_cov: 0.1
      acc_cov: 0.1
      b_gyr_cov: 0.0001
      b_acc_cov: 0.0001
      # Xsens 为 100 Hz；约 1 秒窗口可降低车辆启动加速度对重力初始化的污染。
      imu_init_num: 100
      filter_size_surf: 0.5
      filter_size_map: 0.5

      # GEODE 官方 alpha_config.yaml 中的 T_IMU_LiDAR：
      # p_imu = R_IMU_LiDAR * p_lidar + t_IMU_LiDAR。
      extrinsic_T: [0.0961, -0.1338, 0.3032]
      extrinsic_R: [0.9999, 0.0049, 0.0153,
                    -0.0050, 1.0000, 0.0021,
                    -0.0153, -0.0022, 0.9999]
      extrinsic_est_en: false

      nearest_search_num: 5
      nearest_sq_dist_threshold: 5.0
      plane_residual_threshold: 0.1
      effective_score_threshold: 0.9
      scan_match_max_iteration: 3
      scan_match_min_effective_points: 20
      laser_point_cov: 0.001
      map_init_min_points: 6
      cube_len: 1000.0
      det_range: 100.0
      move_threshold: 1.5
      local_map_enable: true
      local_map_delete_enable: true

    adaptive_map:
      # 首次运行先关闭策略，确认输入时间、外参与基础里程计工作正常。
      enable: true                          # 是否启用 idea 模块的退化感知地图更新；false 时尽量保持原 FAST-LIO2 入图行为。
      min_effective_points: 200             # 单帧有效点到面约束数量下限，低于该值认为当前帧约束不足。
      # 与 preprocess.blind 对齐，避免 Adaptive 额外删除 0.5 至 2.0 m 的近距离约束。
      min_range: 0.5                        # 允许入图的最小 LiDAR 量程，过滤过近点和盲区附近不稳定点。
      max_range: 100.0                      # 允许入图的最大 LiDAR 量程，过滤远距离噪声和稀疏弱约束点。
      residual_scale: 2.0                   # 单点残差阈值相对当前帧平均残差的放大系数。
      residual_robust_sigma: 2.5            # 稳健残差阈值系数，用 median + sigma * 1.4826 * MAD 抑制异常残差。
      min_quality_score: 0.92               # 单点 FAST-LIO2 风格质量分数下限，低质量匹配点不允许入图。
      min_effective_ratio: 0.1              # 有效约束点占下采样点数的比例下限，用于单帧退化判断。
      max_mean_residual: 0.15               # 当前帧平均点到面残差上限，超过则认为匹配质量差。
      min_normal_eigen_ratio: 0.02          # 法向信息矩阵最小/最大特征值比例下限，过低表示约束方向单一。
      normal_bin_angle_deg: 15.0            # 法向方向分箱角度，退化帧中用于限制重复方向点入图。
      max_points_per_normal_bin: 30         # 退化帧内每个法向方向分箱最多允许写入地图的点数。
      max_novel_points_per_frame: 50        # 退化帧内地图未知区域 novel points 的帧级入图上限。

    runtime_log:
      summary_interval_frames: 10
      sensor_debug: true
      csv_enable: false
      csv_append: false
      csv_path: "/home/romi/Adaptive_FAST_LIO2/experiments/geode_urban_tunnel01/results/adaptive_runtime.csv"
