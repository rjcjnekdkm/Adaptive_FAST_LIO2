adaptive_fastlio_mapping:
  ros__parameters:
    common:
      # GEODE Tunneling_tunnel2 的 alpha 设备：VLP-16 + Xsens MTi-30。
      lid_topic: "/velodyne_points"
      imu_topic: "/imu/data"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 2
      scan_line: 16
      # GEODE alpha 的 PointCloud2 每点 time 字段以秒计。
      timestamp_unit: 0
      scan_rate: 10
      blind: 0.5

    point_filter_num: 1
    feature_extract_enable: false

    publish:
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: true
      map_en: true

    mapping:
      # 原 SubT 值（不适用于 GEODE alpha / Xsens MTi-30）：
      # gyr_cov: 0.1
      # acc_cov: 0.1
      # b_gyr_cov: 0.0001
      # b_acc_cov: 0.0001
      # GEODE alpha_config.yaml 给出的是标准差；Adaptive FAST-LIO2 此处
      # 直接使用过程噪声协方差，故填入标准差平方。
      gyr_cov: 0.0000934911775262      # gyro_std^2
      acc_cov: 0.000109862812398       # accel_std^2
      b_gyr_cov: 0.00000000687039996552 # gyro_rw^2
      b_acc_cov: 0.0000000340460117699  # accel_rw^2
      # imu_init_num: 100  # 上一版：约 1 s（GEODE IMU 约 100 Hz）。
      imu_init_num: 400    # 当前测试：约 4 s，使用更多静止 IMU 样本估计重力与零偏。
      filter_size_surf: 0.5
      filter_size_map: 0.5

      # GEODE 官方 alpha_config.yaml 的 T_IMU_LiDAR：
      # p_imu = R_IMU_LiDAR * p_lidar + t_IMU_LiDAR。
      extrinsic_T: [0.010965, -0.086864, 0.060426]
      extrinsic_R: [0.9989892, 0.0444870, -0.0064406,
                    -0.0446353, 0.9986885, -0.0250789,
                    0.0053164, 0.0253410, 0.9996647]
      extrinsic_est_en: false

      nearest_search_num: 5
      nearest_sq_dist_threshold: 5.0
      plane_residual_threshold: 0.1
      effective_score_threshold: 0.9
      scan_match_max_iteration: 3
      scan_match_min_effective_points: 20
      laser_point_cov: 0.001
      map_init_min_points: 6
      cube_len: 1000.0
      det_range: 100.0
      move_threshold: 1.5
      local_map_enable: true
      local_map_delete_enable: true

    adaptive_map:
      enable: true
      min_effective_points: 200
      min_range: 0.5
      max_range: 100.0
      residual_scale: 2.0
      residual_robust_sigma: 2.5
      min_quality_score: 0.92
      min_effective_ratio: 0.1
      max_mean_residual: 0.15
      min_normal_eigen_ratio: 0.02
      normal_bin_angle_deg: 15.0
      max_points_per_normal_bin: 30
      max_novel_points_per_frame: 50

    adaptive_window:
      enable: true
      size: 20
      persistent_ratio_threshold: 0.5
      normal_ratio_scale: 1.5
      residual_stability_ratio: 0.5
      min_motion: 2.0
      max_yaw_change: 0.25
      min_recent_degenerate_streak: 2
      min_condition_number: 50.0
      enter_count_threshold: 3
      exit_count_threshold: 5
      persistent_direction_quota_scale: 0.5
      persistent_novel_quota_scale: 0.5

    runtime_log:
      summary_interval_frames: 1000000
      sensor_debug: false
      console_enable: false
      csv_enable: true
      csv_append: false
      csv_path: "/home/romi/Adaptive_FAST_LIO2/experiments/geode_bridge01_official_imu/results/adaptive_runtime.csv"
