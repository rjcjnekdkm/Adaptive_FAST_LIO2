adaptive_fastlio_mapping:
  ros__parameters:
    common:
      # HILTI 2021 Basement_1: Livox Mid-70 + Alphasense IMU.
      lid_topic: "/livox/lidar"
      # This is the body IMU directly used as the calibration parent frame.
      imu_topic: "/alphasense/imu"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 1
      # Mid-70 CustomMsg contains a single line; feature extraction is off.
      scan_line: 1
      timestamp_unit: 2
      scan_rate: 10
      blind: 1.0

    point_filter_num: 3
    feature_extract_enable: false

    publish:
      scan_publish_en: true
      dense_publish_en: true
      scan_bodyframe_pub_en: true
      map_en: true

    mapping:
      gyr_cov: 0.1
      acc_cov: 0.1
      b_gyr_cov: 0.0001
      b_acc_cov: 0.0001
      imu_init_num: 400
      filter_size_surf: 0.5
      filter_size_map: 0.5

      # HILTI calibration.yaml's T_imu_livox_frame:
      # p_imu = R_imu_livox * p_livox + t_imu_livox.
      extrinsic_T: [-0.003050708, -0.021993854, 0.150764152]
      extrinsic_R: [0.999830032, 0.017023226, -0.007079288,
                    0.017141660, -0.999708203, 0.017019789,
                   -0.006787491, -0.017138247, -0.999830091]
      extrinsic_est_en: false

      nearest_search_num: 5
      nearest_sq_dist_threshold: 5.0
      plane_residual_threshold: 0.1
      effective_score_threshold: 0.9
      scan_match_max_iteration: 3
      scan_match_min_effective_points: 20
      laser_point_cov: 0.001
      map_init_min_points: 6
      cube_len: 1000.0
      det_range: 200.0
      move_threshold: 1.5
      local_map_enable: true
      local_map_delete_enable: true

    adaptive_map:
      enable: true
      min_effective_points: 200
      min_range: 1.0
      max_range: 200.0
      residual_scale: 2.0
      residual_robust_sigma: 2.5
      min_quality_score: 0.92
      min_effective_ratio: 0.1
      max_mean_residual: 0.15
      min_normal_eigen_ratio: 0.02
      normal_bin_angle_deg: 15.0
      max_points_per_normal_bin: 30
      max_novel_points_per_frame: 50

    adaptive_window:
      enable: true
      size: 20
      persistent_ratio_threshold: 0.5
      normal_ratio_scale: 1.5
      residual_stability_ratio: 0.5
      min_motion: 2.0
      max_yaw_change: 0.25
      min_recent_degenerate_streak: 2
      min_condition_number: 50.0
      enter_count_threshold: 3
      exit_count_threshold: 5
      persistent_direction_quota_scale: 0.5
      persistent_novel_quota_scale: 0.5
      persistent_insert_quota_scale: 0.3
      persistent_insert_quota_min: 2
      persistent_insert_quota_max: 5

    runtime_log:
      summary_interval_frames: 1000000
      sensor_debug: false
      console_enable: false
      csv_enable: true
      csv_append: false
      csv_path: "/home/romi/Adaptive_FAST_LIO2/experiments/hilti_basement1/ours_frontend/adaptive_runtime.csv"
