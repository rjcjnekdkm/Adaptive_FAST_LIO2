laser_mapping:
  ros__parameters:
    # GEODE Metro Tunnels, Gamma device: Livox AVIA + external Xsens MTi-30.
    # This is an original FAST-LIO2 baseline configuration: no adaptive map
    # update and no custom backend are involved in this launch.
    feature_extract_enable: false
    point_filter_num: 3
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    map_file_path: "./geode_tunneling_tunnel_gamma_fastlio.pcd"

    common:
      lid_topic: "/livox/lidar"
      imu_topic: "/imu/data"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 1
      scan_line: 6
      blind: 4.0

    mapping:
      # Keep FAST-LIO2's AVIA baseline covariance tuning for a fair baseline.
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 90.0
      det_range: 450.0

      # GEODE gamma.yaml: p_imu = R * p_lidar + t.
      extrinsic_est_en: false
      extrinsic_T: [0.049258, -0.012500, 0.026946]
      extrinsic_R: [0.999620, 0.027463, 0.002445,
                    -0.027517, 0.999299, 0.025398,
                    -0.001746, -0.025456, 0.999674]

    publish:
      path_en: true
      map_en: true
      scan_publish_en: true
      dense_publish_en: true
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: false
      interval: -1
