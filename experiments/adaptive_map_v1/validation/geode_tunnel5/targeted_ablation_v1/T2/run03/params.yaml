/adaptive_fastlio_mapping:
  ros__parameters:
    adaptive_map:
      enable: true
      invalid_quality_filter_enable: false
      max_mean_residual: 0.15
      max_novel_points_per_frame: 50
      max_points_per_normal_bin: 30
      max_range: 200.0
      min_effective_points: 200
      min_effective_ratio: 0.1
      min_normal_eigen_ratio: 0.02
      min_quality_score: 0.92
      min_range: 2.0
      normal_bin_angle_deg: 15.0
      residual_robust_sigma: 2.5
      residual_scale: 2.0
      transient_novel_quota_enable: false
    adaptive_window:
      enable: true
      enter_count_threshold: 3
      exit_count_threshold: 5
      max_yaw_change: 0.25
      min_condition_number: 50.0
      min_motion: 2.0
      min_recent_degenerate_streak: 2
      normal_ratio_scale: 1.5
      persistent_direction_quota_scale: 0.5
      persistent_insert_quota_max: 5
      persistent_insert_quota_min: 2
      persistent_insert_quota_scale: 0.3
      persistent_novel_quota_scale: 0.5
      persistent_ratio_threshold: 0.5
      residual_stability_ratio: 0.5
      size: 20
    common:
      imu_topic: /imu/data
      lid_topic: /livox/lidar
      time_offset_lidar_to_imu: 0.0
      time_sync_en: false
    feature_extract_enable: false
    mapping:
      acc_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      cube_len: 1000.0
      det_range: 200.0
      effective_score_threshold: 0.9
      extrinsic_R:
      - 0.99962
      - 0.027463
      - 0.002445
      - -0.027517
      - 0.999299
      - 0.025398
      - -0.001746
      - -0.025456
      - 0.999674
      extrinsic_T:
      - 0.049258
      - -0.0125
      - 0.026946
      extrinsic_est_en: false
      filter_size_map: 0.5
      filter_size_surf: 0.5
      gyr_cov: 0.1
      imu_init_num: 10
      laser_point_cov: 0.001
      local_map_delete_enable: true
      local_map_enable: true
      map_init_min_points: 6
      move_threshold: 1.5
      nearest_search_num: 5
      nearest_sq_dist_threshold: 5.0
      plane_residual_threshold: 0.1
      scan_match_max_iteration: 3
      scan_match_min_effective_points: 20
    point_filter_num: 3
    preprocess:
      blind: 2.0
      lidar_type: 1
      scan_line: 6
      scan_rate: 10
      timestamp_unit: 2
    publish:
      dense_publish_en: true
      map_en: true
      scan_bodyframe_pub_en: true
      scan_publish_en: true
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf:
        publisher:
          depth: 100
          durability: volatile
          history: keep_last
          reliability: reliable
    runtime_log:
      console_enable: false
      csv_append: false
      csv_enable: true
      csv_path: /home/romi/Adaptive_FAST_LIO2/experiments/adaptive_map_v1/validation/geode_tunnel5/targeted_ablation_v1/T2/run03/runtime.csv
      sensor_debug: false
      summary_interval_frames: 1000000
    use_sim_time: true

